worker_processes auto;

events {
    worker_connections 4096;
}

http {
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name your-domain.example.com;

        charset utf-8;

        location = / {
            default_type application/json;
            return 200 '{"service":"frp-nginx-gateway","status":"ok"}';
        }

        location = /oa {
            return 301 /oa/;
        }

        location /oa/ {
            proxy_pass http://127.0.0.1:6001/;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /oa;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect ~^(/.*)$ /oa$1;
            proxy_redirect ~^http://[^/]+(/.*)$ /oa$1;
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript text/javascript application/json;
            sub_filter 'href="/' 'href="/oa/';
            sub_filter 'src="/' 'src="/oa/';
            sub_filter 'action="/' 'action="/oa/';
            sub_filter 'url(/' 'url(/oa/';
        }

        location = /crm {
            return 301 /crm/;
        }

        location /crm/ {
            proxy_pass http://127.0.0.1:6002/;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /crm;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect ~^(/.*)$ /crm$1;
            proxy_redirect ~^http://[^/]+(/.*)$ /crm$1;
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript text/javascript application/json;
            sub_filter 'href="/' 'href="/crm/';
            sub_filter 'src="/' 'src="/crm/';
            sub_filter 'action="/' 'action="/crm/';
            sub_filter 'url(/' 'url(/crm/';
        }

        location = /docs {
            return 301 /docs/;
        }

        location /docs/ {
            proxy_pass http://127.0.0.1:6003/;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /docs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect ~^(/.*)$ /docs$1;
            proxy_redirect ~^http://[^/]+(/.*)$ /docs$1;
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript text/javascript application/json;
            sub_filter 'href="/' 'href="/docs/';
            sub_filter 'src="/' 'src="/docs/';
            sub_filter 'action="/' 'action="/docs/';
            sub_filter 'url(/' 'url(/docs/';
        }
    }
}
