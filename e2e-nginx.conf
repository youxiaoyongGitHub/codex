worker_processes 1;

events {
    worker_connections 1024;
}

pid /tmp/e2e-nginx.pid;
error_log /tmp/e2e-nginx-error.log notice;

http {
    access_log /tmp/e2e-nginx-access.log;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 18080;
        server_name localhost;

        location = / {
            default_type application/json;
            return 200 '{"service":"e2e-gateway","status":"ok"}';
        }

        location = /oa {
            return 301 /oa/;
        }

        location /oa/ {
            proxy_pass http://127.0.0.1:16001/;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /oa;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect ~^(/.*)$ /oa$1;
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript text/javascript application/json;
            sub_filter 'href="/' 'href="/oa/';
            sub_filter 'src="/' 'src="/oa/';
            sub_filter 'action="/' 'action="/oa/';
            sub_filter 'url(/' 'url(/oa/';
            sub_filter '"/' '"/oa/';
            sub_filter "'/" "'/oa/";
        }

        location = /crm {
            return 301 /crm/;
        }

        location /crm/ {
            proxy_pass http://127.0.0.1:16002/;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /crm;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect ~^(/.*)$ /crm$1;
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript text/javascript application/json;
            sub_filter 'href="/' 'href="/crm/';
            sub_filter 'src="/' 'src="/crm/';
            sub_filter 'action="/' 'action="/crm/';
            sub_filter 'url(/' 'url(/crm/';
            sub_filter '"/' '"/crm/';
            sub_filter "'/" "'/crm/";
        }

        location = /docs {
            return 301 /docs/;
        }

        location /docs/ {
            proxy_pass http://127.0.0.1:16003/;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /docs;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect ~^(/.*)$ /docs$1;
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript text/javascript application/json;
            sub_filter 'href="/' 'href="/docs/';
            sub_filter 'src="/' 'src="/docs/';
            sub_filter 'action="/' 'action="/docs/';
            sub_filter 'url(/' 'url(/docs/';
            sub_filter '"/' '"/docs/';
            sub_filter "'/" "'/docs/";
        }
    }
}
